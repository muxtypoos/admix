name: build-and-test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: pip install openpyxl
      - run: npx playwright install --with-deps chromium
      - name: Validate configs, build every organisation, run tests
        run: npm test
      - name: Check the published pages (index.html and <org>/index.html) is up to date
        run: |
          npm run pages
          test -z "$(git status --porcelain -- index.html '*/index.html')" || { git status --porcelain -- index.html '*/index.html'; echo "::error::published pages are stale. Run 'npm run pages' and commit them."; exit 1; }
      - name: Upload one app per organisation
        uses: actions/upload-artifact@v4
        with:
          name: admix-apps
          path: dist/
      - name: Attach apps to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/index.html
          generate_release_notes: true
