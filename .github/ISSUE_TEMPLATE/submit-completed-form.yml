name: Submit your organisation's request form
description: Attach your completed Admix-request-form.xlsx and we will build your version.
title: "Version request: "
labels: ["organisation-request"]
body:
  - type: markdown
    attributes:
      value: |
        1. Download **Admix-request-form.xlsx** from the front page of this repository and fill it in.
        2. Complete section 6 (clinical sign-off: Yes, plus the name and email of the person confirming). Then drag the completed file into the box below.
        3. Submit. An automatic check reads the form and prepares your version for review. If something in the form needs fixing, a reply will tell you what.
  - type: textarea
    id: form
    attributes:
      label: Your completed request form
      description: Drag and drop your Admix-request-form.xlsx here.
    validations:
      required: true
